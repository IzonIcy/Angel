version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      dev-deps:
        patterns:
          - "@biomejs/*"
          - "@types/*"
          - "husky*"
        update-types:
          - "patch"
          - "minor"
      prod-deps:
        patterns:
          - "@anthropic-ai/*"
          - "@clack/*"
          - "@slack/*"
          - "discord.js"
          - "openai"
          - "yaml"
          - "cron-parser"
          - "picocolors"
          - "xxhash-wasm"
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "bun"