openai_api_key: "${OPENAI_API_KEY}"
model: "gpt-5.4"
max_tokens: 8192
max_tool_iterations: 50
timezone: "America/New_York"

channels:
  # discord:
  #   enabled: true
  #   token: "your-discord-bot-token"

  # slack:
  #   enabled: true
  #   bot_token: "xoxb-..."
  #   app_token: "xapp-..."

  # imessage:
  #   enabled: true
  #   imsg_path: "imsg"
  #   service: "auto"   # auto | imessage | sms
  #   region: "US"
  #   allowed_handles:   # optional; if set, only these senders are accepted
  #     - "+14155551212"

  # signal:
  #   enabled: true
  #   account: "+1234567890"
  #   allowed_numbers:  # required - messages denied if empty
  #     - "+1234567890"

memory:
  reflector_enabled: true
  reflector_interval_ms: 900000
  embedding_enabled: false
  token_budget: 1500

model_routing:
  enabled: true
  routes:
    - context: "onboarding"
      model: "gpt-5.4-mini"
    - context: "reflector"
      model: "gpt-5.4-mini"
    - context: "compaction"
      model: "gpt-5.4-mini"
    - context: "scheduler"
      model: "gpt-5.4"
    - context: "default"
      model: "gpt-5.4"

daily_budget:
  enabled: false
  max_total_tokens: 500000
  max_input_tokens: 350000
  max_output_tokens: 150000
  enforce_per_chat: false

memory_quality:
  aging_enabled: true
  decay_half_life_days: 45
  contradiction_detection: true
  source_of_truth_enabled: true

proactive:
  enabled: true
  inactivity_default_minutes: 720

# Optional read-only status page + Prometheus metrics. OFF by default.
# Binds to loopback unless you explicitly set hostname — do not expose it
# without setting `token` (requests then need `Authorization: Bearer <token>`).
# dashboard:
#   enabled: true
#   port: 8642
#   hostname: "127.0.0.1"
#   token: "share-with-metrics-scraper-only"

# security:
#   max_messages_per_minute: 30
#   # OS sandbox for bash commands (Seatbelt on macOS).
#   #   filesystem — shell writes restricted to working dir + temp (default
#   #     on macOS; the only mode that keeps ordinary tooling fully working)
#   #   full       — filesystem restrictions AND all network denied
#   #   off        — no sandbox; commands run with full user privileges
#   sandbox: "full"

