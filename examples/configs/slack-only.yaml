openai_api_key: "${OPENAI_API_KEY}"
model: "gpt-5.4"
timezone: "America/Los_Angeles"
working_dir_isolation: "per_chat"
data_dir: "~/.angel"

channels:
  slack:
    enabled: true
    bot_token: "${SLACK_BOT_TOKEN}"
    app_token: "${SLACK_APP_TOKEN}"
    allowed_users:
      - "U0123456789"

memory:
  reflector_enabled: true
  reflector_interval_ms: 900000
